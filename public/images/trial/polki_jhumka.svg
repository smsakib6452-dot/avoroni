<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE3A8" />
      <stop offset="40%" stop-color="#D4A045" />
      <stop offset="80%" stop-color="#91611B" />
      <stop offset="100%" stop-color="#FFE3A8" />
